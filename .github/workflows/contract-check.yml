name: Live data contract check

# Hits the real WI DNR / USGS endpoints the app depends on and asserts their
# field names and a few known answers haven't changed. Runs here rather than in
# the dev sandbox because the sandbox's proxy blocks every one of these hosts.
#
# Deliberately NOT part of the deploy: a DNR outage must not block shipping the
# app. It runs on demand (and when this check changes); the nightly schedule was removed, and a failure means "go look", not "broken".

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths: [ "tools/contract/**", ".github/workflows/contract-check.yml" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check live data sources
        run: node tools/contract/check-sources.mjs
